# فحص تلقائي مع كل تعديل: البناء، والاختبارات (فلوس + صلاحيات + عزل)، والثغرات، والأسرار المنسية
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delivery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      TEST_MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/delivery_test
      TEST_DATABASE_URL: postgres://dm_app_test:test_app_password_1234@localhost:5432/delivery_test
      TEST_PLATFORM_DATABASE_URL: postgres://dm_platform_test:test_platform_password_1234@localhost:5432/delivery_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dm/shared build
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @dm/api build
      - run: pnpm --filter @dm/web build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: فحص المكتبات من الثغرات المعروفة
        run: pnpm audit --audit-level moderate
      - name: فحص إن مفيش أسرار اترفعت بالغلط
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
