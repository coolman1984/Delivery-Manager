# للتطوير على جهازك: قاعدة البيانات وRedis بس. السيرفر والواجهات بتشتغل بـ pnpm dev
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: dev_owner_password
      POSTGRES_DB: delivery
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata-dev:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']
volumes:
  pgdata-dev:
