# ================================================================
# التشغيل الحقيقي على سيرفر. كل الأسرار بتيجي من ملف .env جنب الملف ده.
# قاعدة البيانات وRedis مش ظاهرين للإنترنت خالص؛ الظاهر بس Caddy (80/443).
# ================================================================
services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?اكتب POSTGRES_PASSWORD في .env}
      POSTGRES_DB: delivery
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?اكتب REDIS_PASSWORD في .env}',
        '--appendonly',
        'yes',
      ]
    volumes: [redisdata:/data]
    networks: [backend]

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ['node', 'dist/db/migrate.js']
    environment: &api-env
      NODE_ENV: production
      DATABASE_URL: postgres://dm_app:${APP_DB_PASSWORD:?اكتب APP_DB_PASSWORD في .env}@postgres:5432/delivery
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/delivery
      PLATFORM_DATABASE_URL: postgres://dm_platform:${PLATFORM_DB_PASSWORD:?اكتب PLATFORM_DB_PASSWORD في .env}@postgres:5432/delivery
      BASE_DOMAIN: ${BASE_DOMAIN:?اكتب BASE_DOMAIN في .env}
      PLATFORM_HOST: ${PLATFORM_HOST:?اكتب PLATFORM_HOST في .env}
      SUBSCRIPTION_GRACE_DAYS: ${SUBSCRIPTION_GRACE_DAYS:-3}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?اكتب JWT_ACCESS_SECRET في .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?اكتب DATA_ENCRYPTION_KEY في .env}
      # الواجهة والسيرفر على نفس العنوان، فمش محتاجين نسمح لعناوين تانية
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${PLATFORM_HOST}}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      OTP_ENABLED: ${OTP_ENABLED:-false}
      MEDIA_DIR: /app/media
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      TRUST_PROXY: '1'
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    restart: 'no'

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *api-env
      # حساب السيرفر مايعرفش كلمة سر المالك
      MIGRATION_DATABASE_URL: ''
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    # صور المحلات والمنتجات المرفوعة
    volumes: [media:/app/media]
    security_opt: ['no-new-privileges:true']

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?اكتب ACME_EMAIL في .env}
    ports: ['80:80', '443:443']
    volumes: [caddydata:/data, caddyconfig:/config]
    depends_on: [api]
    networks: [frontend]

  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    entrypoint: ['bash', '/scripts/backup-loop.sh']
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: delivery
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?اكتب BACKUP_PASSPHRASE في .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes: ['./scripts:/scripts:ro', './backups:/backups', 'media:/media:ro']
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

networks:
  backend: { internal: true }
  frontend: {}

volumes:
  media:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
